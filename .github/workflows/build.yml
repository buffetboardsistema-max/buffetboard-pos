name: Gerar APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o buffetboard-pos.zip && cp -r buffetboard-pos/. . && rm -rf buffetboard-pos
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: BuffetBoardPOS-apk, path: app/build/outputs/apk/debug/*.apk }
