name: Gerar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o buffetboard-pos.zip && cp -r buffetboard-pos/. . && rm -rf buffetboard-pos
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Chave de assinatura (Secrets)
        run: |
          if [ -z "$POS_KEYSTORE_B64" ]; then echo "## ❌ Falta o Secret POS_KEYSTORE_B64" >> $GITHUB_STEP_SUMMARY; exit 1; fi
          printf '%s' "$POS_KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > app/release.jks
          P=$(printf '%s' "$POS_KEYSTORE_PASS" | tr -d ' \r\n\t')
          if ! keytool -list -keystore app/release.jks -storepass "$P" -alias bbpos >/dev/null 2>&1; then echo "## ❌ Chave não abriu: confira POS_KEYSTORE_B64 (linha inteira) e POS_KEYSTORE_PASS" >> $GITHUB_STEP_SUMMARY; exit 1; fi
        env:
          POS_KEYSTORE_B64: ${{ secrets.POS_KEYSTORE_B64 }}
          POS_KEYSTORE_PASS: ${{ secrets.POS_KEYSTORE_PASS }}
      - run: bash ci.sh
        env:
          CIELO_CLIENT_ID: ${{ secrets.CIELO_CLIENT_ID }}
          CIELO_ACCESS_TOKEN: ${{ secrets.CIELO_ACCESS_TOKEN }}
          POS_KEYSTORE_PASS: ${{ secrets.POS_KEYSTORE_PASS }}
          POS_PING_KEY: ${{ secrets.POS_PING_KEY }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Buffet Board POS
          make_latest: true
          files: |
            saida/BuffetBoardPOS.apk
            saida/versao.json
      - uses: actions/upload-artifact@v4
        with: { name: BuffetBoardPOS-apk, path: saida/BuffetBoardPOS.apk }
