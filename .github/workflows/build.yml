name: Gerar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o buffetboard-pos.zip && cp -r buffetboard-pos/. . && rm -rf buffetboard-pos
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - run: bash ci.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Buffet Board POS
          make_latest: true
          files: |
            saida/BuffetBoardPOS.apk
            saida/versao.json
      - uses: actions/upload-artifact@v4
        with: { name: BuffetBoardPOS-apk, path: saida/BuffetBoardPOS.apk }
